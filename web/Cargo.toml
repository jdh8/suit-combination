[package]
name = "suit-combination-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
license = "Apache-2.0"
description = "Browser front end for suit-combination: single-dummy practice problems"

# Standalone crate: an empty `[workspace]` makes this its own workspace root so
# the parent library never adopts it.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
suit-combination = { path = "..", features = ["serde"] }
contract-bridge = "0.1.4"
# Same version as pons-web; the 0.2.129 CLI rejects this crate's output
# ("failed to find __wbindgen_externref_table_alloc").
wasm-bindgen = "0.2.126"
serde_json = "1"
